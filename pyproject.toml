[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caerus-offline-rl"
version = "0.1.0"
description = "Offline cost-aware cross-venue latency-arbitrage research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3"]

[project.optional-dependencies]
data = ["pandas>=2.2,<4", "pyarrow>=16", "clickhouse-connect>=0.8"]
test = ["pytest>=8,<10"]
reports = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "latency_arb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
